name: Ritikda Fast Autonomous Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  parallel-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Parallel Autonomous Ping
        run: |
          pip3 install requests urllib3 -q
          python3 ritikda_auto_ping.py --once | tee -a $GITHUB_STEP_SUMMARY
